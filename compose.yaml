services:
  app:
    build: .
    env_file: .env
    environment:
      HUB_ENV: production
      HUB_DATA_DIR: /var/lib/tradexa
      PORT: "8000"
    volumes:
      - tradexa-data:/var/lib/tradexa
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app: {condition: service_healthy}
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}

volumes:
  tradexa-data:
